recent:
  - version:
    date: 2026-11-19
    notes: "First-wave practice topics, release prep: on the owner's decision all five (Conditionals, Passive Voice, Prepositions, Relative Clauses, Comparatives & Superlatives) ship in 1.5.0 with the scoring prompt as it is. Passive Voice, Prepositions and Relative Clauses meet all three quality criteria; Comparatives & Superlatives and Conditionals are over the false 'correct' line and ship on the owner's acceptance, not as a pass. The topics are switched on in the app (ten topics in Topic Practice) and in the proxy's source, with three small fixes (a scoring retry on the server, a loading screen without a number of questions, an empty practice set treated as a failed generation) and a rewritten Modal Past Forms hint card. On branch ui-polish-widgets; the proxy is not deployed, nothing is merged or released, no version bump."
  - version:
    date: 2026-11-19
    notes: "First-wave practice topics: on the owner's decisions the first scoring prompt candidate is dropped and the two scoring criteria are read on all 1,190 labelled answers together. Read that way the production scoring prompt passes Passive Voice, Prepositions and Relative Clauses; Conditionals (false 'correct' 5 of 132) and Comparatives & Superlatives (2 of 95) do not pass yet. Three small scoring candidates (spelling, conditional types, both) are in the proxy's source beside the production prompt, none live, with the tooling to score the labelled answers with each (dry run 960 calls, about $1.19); the run is the owner's. No API call, nothing deployed, the topics stay hidden."
  - version:
    date: 2026-11-19
    notes: "First-wave practice topics: the final configuration is measured, labelled (225 questions, 651 built answers) and reported. With the production scoring prompt Passive Voice and Relative Clauses pass the owner's three criteria; Prepositions and Comparatives & Superlatives fail on false 'correct' by one answer each, Conditionals by two. The practice-path changes did what they were for: no fill-in-the-blank question without a blank in 300, and practice sets of one topic no longer repeat each other. The scoring prompt candidate is recommended against (worse on the 1,163 labelled answers both prompts scored) and stays out of production. Found on the way: the Modal Past Forms hint card teaches another structure than the topic's description asks the generator for. Nothing is deployed; $2.52 of the $15 cap spent. The topics stay switched off; not on main, not shipped."
  - version:
    date: 2026-11-19
    notes: "First-wave practice topics: the Conditionals re-measurement is labelled; its fix kept mixed conditionals out and the topic now fails by a single answer (false 'correct' 1 of 41). On the owner's decisions the proxy's source now holds the practice path as it is meant to ship, for all ten topics: a guard that removes a fill-in-the-blank question without a blank, a prompt line asking for 1 to 4 blanks, and a scenario theme per practice set so that two sets of one topic differ (no app change, no new data sent); and a scoring prompt candidate beside the production prompt, not live. Nothing is deployed. Two measurement runs of this configuration are ready for the owner (dry runs: 465 calls about $2.28, and 146 calls about $0.18; $0.89 of the $15 cap spent so far). No API call made. The topics stay switched off; not on main, not shipped."
  - version:
    date: 2026-11-18
    notes: "First-wave practice topics, Conditionals: the owner decided to fix it and measure it again. The proxy's source now adds one generation-only sentence to the Conditionals practice request (first, second and third conditional only, no mixed conditional); no other topic's request changes, nothing is deployed, and the note is not in the app. The re-measurement of that topic alone is ready to run under the same $15 cap (dry run: 36 calls, about $0.24; the first run's $0.76 counts as spent). Also found: a fill-in-the-blank practice item without a blank is shown with one answer box and nothing on the live path stops it; a guard is proposed, not built. No API call made. The topics stay switched off; not on main, not shipped."

