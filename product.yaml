recent:
  - version: 1.5.0
    date: 2026-11-21
    notes: "Fix round 7, before the 1.5.0 store build: two findings of the iPad walk fixed on main, version unchanged (1.5.0 build 8). On the day of a learner's second Daily Test, the question about daily reminders opened over Home before the day's step was seen; it now comes after the step, a save point's name and a one-second pause. The app's bottom sheets kept their old background when the phone switched between light and dark mode while one was open, leaving its text hard to read; they now change with it. 2939 app tests and 23 widget and reminder tests pass, both builds succeed, checked on the simulator. Not built for the store, not uploaded, not submitted."
  - version: 1.5.0
    date: 2026-11-21
    notes: "1.5.0 release preparation, part 1: on the owner's word after his device checks of 19 to 21 November, the UI polish, the home-screen widgets, the daily reminders and the five new practice topics were merged into main, with the two unreleased November fixes (the lira symbol, the storage reset), and the version set to 1.5.0 build 8. On main the code checks are clean, all 2925 app tests and 23 widget and reminder tests pass, and the release build (unsigned) carries the app and the widget extension both at 1.5.0 (8). The release IPA check now also checks the widget extension. Nothing new is collected or shared (the reminders are local, the widgets read what the app wrote on the device). An iPad walk on the simulator found nothing blocking. Release steps written for the owner; not built for the store, not uploaded, not submitted."
  - version:
    date: 2026-11-19
    notes: "Fix round 6 on branch ui-polish-widgets, after the owner's device check of the same day (he had deployed the proxy for 1.5.0 himself). Fixed: when the practice allowance is used before the Daily Test, Home now plays the day's step (the walk, a save point's light and name), lets the pawn rest for a second and only then fades to the rest scene, where it used to show the rest scene at once and never the step. Fixed: Review's weak-spot card struck a long piece of the learner's line, with instruction words and bracketed cues, on multi-blank practice answers; the wrong word is now struck in place. Fixed on the way: Review's list was not refreshed after a practice started with the ticket. Measured, not changed: the Daily Test card's companion hops as specified (16 pt every 1.2 s). Not merged, not released, no version bump; waiting for the owner's next device check."
  - version:
    date: 2026-11-19
    notes: "First-wave practice topics, release prep: on the owner's decision all five (Conditionals, Passive Voice, Prepositions, Relative Clauses, Comparatives & Superlatives) ship in 1.5.0 with the scoring prompt as it is. Passive Voice, Prepositions and Relative Clauses meet all three quality criteria; Comparatives & Superlatives and Conditionals are over the false 'correct' line and ship on the owner's acceptance, not as a pass. The topics are switched on in the app (ten topics in Topic Practice) and in the proxy's source, with three small fixes (a scoring retry on the server, a loading screen without a number of questions, an empty practice set treated as a failed generation) and a rewritten Modal Past Forms hint card. On branch ui-polish-widgets; the proxy is not deployed, nothing is merged or released, no version bump."
  - version:
    date: 2026-11-19
    notes: "First-wave practice topics: on the owner's decisions the first scoring prompt candidate is dropped and the two scoring criteria are read on all 1,190 labelled answers together. Read that way the production scoring prompt passes Passive Voice, Prepositions and Relative Clauses; Conditionals (false 'correct' 5 of 132) and Comparatives & Superlatives (2 of 95) do not pass yet. Three small scoring candidates (spelling, conditional types, both) are in the proxy's source beside the production prompt, none live, with the tooling to score the labelled answers with each (dry run 960 calls, about $1.19); the run is the owner's. No API call, nothing deployed, the topics stay hidden."

