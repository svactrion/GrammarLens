<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
<style>
#gl-topics .gt-controls{max-width:210px;margin-bottom:14px}#gl-topics .gt-stage{padding:24px 10px}
#gl-topics .gt-phone{--gt-bg:#F3EFE6;--gt-card:#FFFBF4;--gt-tile:#F6F0E5;--gt-text:#1B1B1F;--gt-muted:#46464F;--gt-brand:#FF7A1A;--gt-link:#0D3B8F;--gt-info:#D7E1FA;--gt-oninfo:#0A2E70;--gt-line:#DED5C6;--gt-shadow:0 5px 18px #4830181A;width:100%;max-width:390px;min-height:880px;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:30px;background:var(--gt-bg);color:var(--gt-text);font:400 14px/1.45 'Nunito Sans',sans-serif;box-shadow:0 14px 46px #24120018;color-scheme:light}
#gl-topics .gt-dark{--gt-bg:#151517;--gt-card:#252528;--gt-tile:#303034;--gt-text:#F0ECE7;--gt-muted:#C9C5D0;--gt-brand:#FF8A3D;--gt-link:#B4C8FF;--gt-info:#243859;--gt-oninfo:#D8E1FF;--gt-line:#45454D;--gt-shadow:0 5px 18px #0000002B;color-scheme:dark}
#gl-topics .gt-phone *{box-sizing:border-box}#gl-topics .gt-phone button{font:inherit}#gl-topics .gt-phone h1,#gl-topics .gt-phone h2,#gl-topics .gt-phone p{margin:0}#gl-topics .gt-phone svg{width:19px;height:19px;flex-shrink:0}
#gl-topics .gt-header{padding:14px 22px 22px}#gl-topics .gt-status{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;margin-bottom:20px}#gl-topics .gt-status span:last-child{display:flex;gap:5px}#gl-topics .gt-status svg{width:14px;height:14px}#gl-topics .gt-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}#gl-topics .gt-back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--gt-card);border:1px solid var(--gt-line);border-radius:14px;color:var(--gt-text)}#gl-topics .gt-access{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#241200;background:var(--gt-brand);padding:6px 10px;border-radius:9px}#gl-topics .gt-access svg{width:14px;height:14px;color:#241200}#gl-topics .gt-header h1{font-size:32px;line-height:1.1;letter-spacing:-1px;font-weight:900}#gl-topics .gt-header p{font-size:14px;color:var(--gt-muted);margin-top:8px}
#gl-topics .gt-main{padding:0 18px 25px}#gl-topics .gt-list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}#gl-topics .gt-list-head h2{font-size:16px;line-height:1.25;letter-spacing:-.25px;font-weight:800}#gl-topics .gt-list-head span{font-size:11px;color:var(--gt-muted)}#gl-topics .gt-list{display:grid;gap:12px}
#gl-topics .gt-topic{width:100%;display:grid;grid-template-columns:38px minmax(0,1fr) 15px;gap:11px;align-items:start;text-align:left;padding:17px 15px;background:var(--gt-card);border:1px solid var(--gt-line);border-radius:22px;color:var(--gt-text);box-shadow:var(--gt-shadow)}#gl-topics .gt-topic-icon{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--gt-tile);color:var(--gt-link)}#gl-topics .gt-topic-icon svg{width:20px;height:20px}#gl-topics .gt-topic strong{display:block;font-size:17px;font-weight:800;line-height:1.23;letter-spacing:-.25px;margin:1px 0 6px}#gl-topics .gt-description{display:block;font-size:13px;line-height:1.45;color:var(--gt-muted)}#gl-topics .gt-meta{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:11px;color:var(--gt-muted);font-weight:600}#gl-topics .gt-meta svg{width:12px;height:12px}#gl-topics .gt-chevron{width:15px!important;height:15px!important;color:var(--gt-link);align-self:center}#gl-topics .gt-topic:active{background:var(--gt-tile)}
#gl-topics .gt-bottom{width:110px;height:4px;border-radius:5px;background:var(--gt-text);opacity:.75;margin:auto auto 20px}
#gl-topics .gt-overlay{position:absolute;inset:0;z-index:5;background:#10121B80;display:flex;align-items:center;padding:20px}#gl-topics .gt-dialog{width:100%;border-radius:24px;padding:24px;background:var(--gt-card);box-shadow:var(--gt-shadow)}#gl-topics .gt-dialog h2{font-size:25px;font-weight:900;line-height:1.2;letter-spacing:-.5px;margin-bottom:12px}#gl-topics .gt-dialog p{font-size:14px;color:var(--gt-muted);line-height:1.5}#gl-topics .gt-close{display:flex;align-items:center;justify-content:center;float:right;width:40px;height:40px;margin:-12px -12px 5px 7px;background:var(--gt-tile);color:var(--gt-text);border:0;border-radius:50%}#gl-topics .gt-start{display:block;width:100%;border:0;background:#0D3B8F;color:#fff;font-weight:800!important;font-size:14px!important;min-height:48px;border-radius:14px;margin-top:22px}#gl-topics [hidden]{display:none!important}#gl-topics .gt-preview-note{margin-top:12px}
@media(max-width:390px){#gl-topics .gt-stage{padding:20px 0}#gl-topics .gt-header{padding-left:18px;padding-right:18px}#gl-topics .gt-main{padding-left:14px;padding-right:14px}#gl-topics .gt-topic{padding:15px 13px;gap:9px;grid-template-columns:35px minmax(0,1fr) 14px}#gl-topics .gt-topic-icon{width:35px;height:35px}#gl-topics .gt-topic strong{font-size:16px}}
</style>
<div id="gl-topics">
 <div class="gt-controls"><label class="form-label" for="gt-theme">Görünüm</label><select class="form-select" id="gt-theme"><option value="light">Fil dişi</option><option value="dark">Koyu</option></select></div>
 <div class="gt-stage viz-dotted-background"><article class="gt-phone" aria-label="Topic Practice, premium access">
  <header class="gt-header"><div class="gt-status"><span>9:41</span><span><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-full" aria-hidden="true"></i></span></div><div class="gt-top-row"><button class="gt-back" aria-label="Back to Home"><i data-lucide="arrow-left" aria-hidden="true"></i></button><span class="gt-access"><i data-lucide="check" aria-hidden="true"></i>Premium access</span></div><h1>Topic Practice</h1><p>Choose a topic to work on.</p></header>
  <main class="gt-main"><div class="gt-list-head"><h2>Grammar topics</h2><span>5 topics</span></div><div class="gt-list"></div></main><div class="gt-bottom" aria-hidden="true"></div>
  <div class="gt-overlay" hidden><section class="gt-dialog" role="dialog" aria-modal="true" aria-label="Topic practice"><button class="gt-close" aria-label="Close"><i data-lucide="x" aria-hidden="true"></i></button><h2 data-selected-title></h2><p data-selected-description></p><button class="gt-start">Start practice</button></section></div>
 </article></div><p class="gt-preview-note text-small text-muted" role="status" hidden></p>
</div>
<script>
(()=>{
 const root=document.getElementById('gl-topics'),phone=root.querySelector('.gt-phone'),select=root.querySelector('#gt-theme'),overlay=root.querySelector('.gt-overlay'),list=root.querySelector('.gt-list'),note=root.querySelector('.gt-preview-note');
 const topics=[{title:'Gerund vs. Infinitive',description:'“Enjoy swimming” or “want to swim”?',icon:'split'},{title:'Modal Verbs',description:'Can, could, must, should and might.',icon:'message-circle'},{title:'Modal Past Forms',description:'Past and reported forms: will → would, can → could.',icon:'history'},{title:'Tense Selection',description:'Choose the right tense for the situation.',icon:'clock-3'},{title:'Articles',description:'A, an, the — and when to use none.',icon:'type'}];
 let theme='light',selected=null,opener;const saved=window.openai?.widgetState?.privateContent;if(saved?.screen==='topics'&&saved.theme==='dark')theme='dark';
 function icons(){globalThis.lucide?.createIcons();root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));}
 function persist(){window.openai?.setWidgetState({modelContent:{screen:'Topics',theme,premiumAccess:true,selectedTopic:selected?.title||null,status:'Draft for approval'},privateContent:{screen:'topics',theme}})?.catch(()=>{});}
 function render(){phone.classList.toggle('gt-dark',theme==='dark');select.value=theme;}
 function close(){overlay.hidden=true;[...phone.children].filter(n=>n!==overlay).forEach(n=>n.inert=false);opener?.focus();}
 topics.forEach(topic=>{const button=document.createElement('button');button.className='gt-topic';button.dataset.topicName=topic.title;button.setAttribute('aria-label',topic.title+' — start practice');button.innerHTML='<span class="gt-topic-icon"><i data-lucide="'+topic.icon+'" aria-hidden="true"></i></span><span><strong>'+topic.title+'</strong><span class="gt-description">'+topic.description+'</span><span class="gt-meta"><i data-lucide="circle" aria-hidden="true"></i>Not started yet</span></span><i class="gt-chevron" data-lucide="chevron-right" aria-hidden="true"></i>';button.addEventListener('click',()=>{selected=topic;opener=button;root.querySelector('[data-selected-title]').textContent=topic.title;root.querySelector('[data-selected-description]').textContent=topic.description;overlay.hidden=false;[...phone.children].filter(n=>n!==overlay).forEach(n=>n.inert=true);root.querySelector('.gt-start').focus();persist();});list.append(button);});
 select.addEventListener('change',()=>{theme=select.value;render();persist();});root.querySelector('.gt-close').addEventListener('click',close);root.querySelector('.gt-start').addEventListener('click',()=>{root.dispatchEvent(new CustomEvent('gl:topic-start',{bubbles:true,detail:selected}));close();note.textContent='Önizleme: '+selected.title+' pratiği başlatılır.';note.hidden=false;});root.querySelector('.gt-back').addEventListener('click',()=>{root.dispatchEvent(new CustomEvent('gl:home',{bubbles:true}));note.textContent='Önizleme: Home ekranına dönüş.';note.hidden=false;});overlay.addEventListener('click',e=>{if(e.target===overlay)close();});overlay.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const first=root.querySelector('.gt-close'),last=root.querySelector('.gt-start');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s?.screen==='topics'){theme=s.theme==='dark'?'dark':'light';render();}});render();icons();
})();
</script>
