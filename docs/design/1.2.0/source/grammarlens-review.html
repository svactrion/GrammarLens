<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
<style>
#gl-review .rv-controls{margin-bottom:14px}#gl-review .rv-control{width:190px}
#gl-review .rv-stage{padding:24px 10px;min-height:1030px}
#gl-review .rv-phone{--rv-bg:#F3EFE6;--rv-card:#FFFBF4;--rv-tile:#F6F0E5;--rv-text:#1B1B1F;--rv-muted:#46464F;--rv-brand:#FF7A1A;--rv-ink:#241200;--rv-link:#0D3B8F;--rv-info:#D7E1FA;--rv-oninfo:#0A2E70;--rv-line:#DED5C6;--rv-nav:#FFFCF7;--rv-navline:#D2C6B4;--rv-shadow:0 5px 18px #4830181A;--rv-navshadow:0 6px 22px #48301826;width:100%;max-width:390px;min-height:940px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:30px;background:var(--rv-bg);color:var(--rv-text);font:400 14px/1.45 'Nunito Sans',sans-serif;box-shadow:0 14px 46px #24120018;color-scheme:light}
#gl-review .rv-dark{--rv-bg:#151517;--rv-card:#252528;--rv-tile:#303034;--rv-text:#F0ECE7;--rv-muted:#C9C5D0;--rv-brand:#FF8A3D;--rv-ink:#F0ECE7;--rv-link:#B4C8FF;--rv-info:#243859;--rv-oninfo:#D8E1FF;--rv-line:#45454D;--rv-nav:#2D2D32;--rv-navline:#595961;--rv-shadow:0 5px 18px #0000002B;--rv-navshadow:0 6px 22px #00000055;color-scheme:dark}
#gl-review .rv-phone *{box-sizing:border-box}#gl-review .rv-phone button,#gl-review .rv-phone select{font:inherit}#gl-review .rv-phone h1,#gl-review .rv-phone h2,#gl-review .rv-phone h3,#gl-review .rv-phone p{margin:0}
#gl-review .rv-header{padding:14px 22px 20px}#gl-review .rv-status{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--rv-ink);margin-bottom:23px}#gl-review .rv-status span:last-child{display:flex;gap:5px}#gl-review .rv-status svg{width:14px;height:14px}
#gl-review .rv-header h1{font-size:34px;line-height:1.1;letter-spacing:-1.1px;font-weight:900;color:var(--rv-ink)}#gl-review .rv-header p{color:var(--rv-muted);font-size:14px;margin-top:7px}
#gl-review .rv-main{padding:0 18px 24px}
#gl-review .rv-free{padding:18px;border-radius:24px;background:var(--rv-brand);color:#241200;box-shadow:var(--rv-shadow)}#gl-review .rv-free-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}#gl-review .rv-eyebrow{font-size:11px;font-weight:800;letter-spacing:1px}#gl-review .rv-free-top svg{width:19px;height:19px}#gl-review .rv-free h2{font-size:23px;line-height:1.15;letter-spacing:-.5px;font-weight:900}#gl-review .rv-free p{font-size:13px;line-height:1.45;margin-top:8px;max-width:280px}#gl-review .rv-free-foot{display:flex;align-items:center;gap:6px;margin-top:13px;font-size:12px;font-weight:800}#gl-review .rv-free-foot svg{width:15px;height:15px}
#gl-review [data-used="true"] .rv-free{background:var(--rv-tile);color:var(--rv-text);box-shadow:none;border:1px solid var(--rv-line)}#gl-review [data-used="true"] .rv-free h2{font-size:21px}#gl-review [data-used="true"] .rv-free p{color:var(--rv-muted)}#gl-review [data-used="true"] .rv-free-foot{color:var(--rv-link)}
#gl-review .rv-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:23px 0 13px}#gl-review .rv-list-head h2{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.2}#gl-review .rv-list-head h2 span{font-size:13px;color:var(--rv-muted);font-weight:600;margin-left:4px}
#gl-review .rv-sort{display:flex;align-items:center;gap:3px;color:var(--rv-link)}#gl-review .rv-sort svg{width:16px;height:16px;flex-shrink:0}#gl-review .rv-sort select{border:0;background:transparent;color:var(--rv-link);font-size:12px;font-weight:800;max-width:109px;min-height:44px;padding:4px 2px}#gl-review .rv-sort option{background:var(--rv-card);color:var(--rv-text)}
#gl-review .rv-list{display:flex;flex-direction:column;gap:12px}
#gl-review .rv-item{display:block;width:100%;border:1px solid var(--rv-line);border-radius:22px;background:var(--rv-card);color:var(--rv-text);padding:17px;text-align:left;box-shadow:var(--rv-shadow)}#gl-review .rv-category{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--rv-link);text-transform:uppercase;margin-bottom:7px;display:block}#gl-review .rv-item-title{display:flex;align-items:center;justify-content:space-between;gap:13px}#gl-review .rv-item-title strong{font-size:18px;font-weight:800;line-height:1.22;letter-spacing:-.25px;max-width:264px}#gl-review .rv-item-title svg{width:18px;height:18px;color:var(--rv-muted);flex-shrink:0}
#gl-review .rv-excerpt{display:block;font-size:13px;line-height:1.45;color:var(--rv-muted);margin-top:9px}#gl-review .rv-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px;font-size:11px;font-weight:600;color:var(--rv-muted)}#gl-review .rv-count{padding:4px 8px;border-radius:8px;background:var(--rv-info);color:var(--rv-oninfo);font-weight:800}#gl-review .rv-date{display:flex;gap:4px;align-items:center}#gl-review .rv-date svg{width:12px;height:12px}
#gl-review .rv-nav-wrap{margin-top:auto;padding:14px 14px 23px}#gl-review .rv-nav{display:flex;align-items:center;justify-content:space-around;padding:10px 6px;background:var(--rv-nav);border:1px solid var(--rv-navline);border-radius:29px;box-shadow:var(--rv-navshadow)}#gl-review .rv-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--rv-ink);min-width:70px;min-height:47px;font-size:11px;font-weight:600}#gl-review .rv-nav svg{width:21px;height:21px}#gl-review .rv-nav [aria-current]{color:var(--rv-link);font-weight:800}
#gl-review .rv-overlay[hidden]{display:none}#gl-review .rv-overlay{position:absolute;inset:0;z-index:10;background:#10121B80;display:flex;align-items:flex-end;padding-top:100px}#gl-review .rv-sheet{width:100%;background:var(--rv-card);color:var(--rv-text);padding:12px 22px 26px;border-radius:28px 28px 0 0;box-shadow:0 -10px 35px #00000025}#gl-review .rv-grip{height:4px;width:36px;background:var(--rv-navline);border-radius:9px;margin:0 auto 20px}#gl-review .rv-close{float:right;display:flex;align-items:center;justify-content:center;width:40px;height:40px;margin:-7px -7px 4px 10px;border:0;border-radius:50%;background:var(--rv-tile);color:var(--rv-text)}#gl-review .rv-close svg{width:18px;height:18px}#gl-review .rv-sheet h2{font-size:26px;line-height:1.15;letter-spacing:-.6px;font-weight:900;margin-top:7px}#gl-review .rv-sheet p{font-size:14px;line-height:1.5;color:var(--rv-muted);margin-top:12px}#gl-review .rv-feedback{margin-top:20px;padding:15px;border-radius:16px;background:var(--rv-tile)}#gl-review .rv-feedback strong{font-size:12px;color:var(--rv-link);font-weight:800;display:flex;align-items:center;gap:6px}#gl-review .rv-feedback strong svg{width:15px;height:15px}#gl-review .rv-feedback p{font-size:14px;color:var(--rv-text);margin-top:9px}
#gl-review .rv-primary{width:100%;min-height:48px;border:0;border-radius:14px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0D3B8F;color:#FFFFFF;font-size:14px!important;font-weight:800!important;margin-top:20px}#gl-review .rv-primary svg{width:17px;height:17px}#gl-review .rv-footnote{text-align:center;font-size:12px!important;line-height:1.4!important;margin-top:10px!important}#gl-review .rv-choice{display:block;width:100%;min-height:48px;margin-top:10px;padding:12px 15px;border:1px solid var(--rv-line);border-radius:12px;background:var(--rv-tile);color:var(--rv-text);font-weight:700!important;text-align:left}#gl-review .rv-choice[aria-pressed="true"]{background:var(--rv-info);color:var(--rv-oninfo);border-color:var(--rv-link)}#gl-review .rv-primary:disabled{opacity:.45;cursor:default}
#gl-review .rv-sample{display:inline-block;margin-top:15px;padding:4px 8px;border-radius:6px;background:var(--rv-info);color:var(--rv-oninfo);font-size:11px;font-weight:800}
@media(max-width:390px){#gl-review .rv-stage{padding:20px 0;min-height:1030px}#gl-review .rv-header{padding-left:18px;padding-right:18px}#gl-review .rv-main{padding-left:14px;padding-right:14px}#gl-review .rv-item{padding:15px}#gl-review .rv-list-head h2{font-size:18px}#gl-review .rv-sort select{max-width:98px}#gl-review .rv-sheet{padding-left:18px;padding-right:18px}}
</style>
<div id="gl-review">
 <div class="viz-row rv-controls"><div class="rv-control"><label class="form-label" for="rv-allowance">Günlük ücretsiz pratik</label><select class="form-select" id="rv-allowance"><option value="available">Kullanılabilir</option><option value="used">Bugün kullanılmış</option></select></div></div>
 <div class="viz-dotted-background" aria-label="Review açık ve koyu tema" data-previous-label="Önceki tema" data-next-label="Sonraki tema">
  <section data-variant="Fil dişi" aria-label="Fil dişi Review"><div class="rv-stage"><article class="rv-phone" aria-label="Review açık tema"></article></div></section>
 </div>
 <template id="rv-template">
  <header class="rv-header"><div class="rv-status"><span>22:03</span><span><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-medium" aria-hidden="true"></i></span></div><h1>Review</h1><p>Turn your mistakes into progress.</p></header>
  <main class="rv-main">
   <section class="rv-free" aria-label="Daily practice allowance"><div class="rv-free-top"><span class="rv-eyebrow">YOUR DAILY PRACTICE</span><i data-lucide="sparkles" aria-hidden="true"></i></div><h2 data-free-title>One weak spot. One step forward.</h2><p data-free-description>Choose any saved weak spot below. Practise for free and get AI feedback.</p><div class="rv-free-foot"><i data-lucide="circle-check" aria-hidden="true"></i><span data-free-status>1 free practice available today</span></div></section>
   <div class="rv-list-head"><h2>Saved weak spots <span>3</span></h2><label class="rv-sort"><i data-lucide="arrow-down-wide-narrow" aria-hidden="true"></i><select aria-label="Sort weak spots"><option value="recent">Recent</option><option value="frequent">Most repeated</option><option value="name">A–Z</option></select></label></div>
   <div class="rv-list" aria-label="Saved weak spots"></div>
  </main>
  <div class="rv-nav-wrap"><nav class="rv-nav" aria-label="Bottom navigation"><button data-nav="home"><i data-lucide="house" aria-hidden="true"></i>Home</button><button data-nav="review" aria-current="page"><i data-lucide="history" aria-hidden="true"></i>Review</button><button data-nav="profile"><i data-lucide="user-round" aria-hidden="true"></i>Profile</button></nav></div>
  <div class="rv-overlay" hidden><section class="rv-sheet" role="dialog" aria-modal="true" aria-label="Weak spot details"><div class="rv-grip"></div><button class="rv-close" aria-label="Close"><i data-lucide="x" aria-hidden="true"></i></button><div class="rv-sheet-body"></div></section></div>
 </template>
</div>
<script>
(()=>{
 const root=document.getElementById('gl-review'),phones=[...root.querySelectorAll('.rv-phone')],select=root.querySelector('#rv-allowance');
 const saved=window.openai?.widgetState?.privateContent;let used=saved?.used===true,sort=['recent','frequent','name'].includes(saved?.sort)?saved.sort:'recent',selected=null;
 const items=[{id:'definite',title:'Article Definite vs. Indefinite',category:'Articles',summary:'“A engineer” should be “an engineer”.',feedback:'Your first two answers (“a” and “the”) are correct. “A engineer” should be “an engineer”.',count:1,order:3,question:'She is ___ engineer.',options:['a','an','the'],answer:1,explanation:'Use “an” before a vowel sound. “Engineer” begins with a vowel sound, so the correct phrase is “an engineer”.'},{id:'usage',title:'Article Usage',category:'Articles',summary:'Use “the” in a complete sentence.',feedback:'You only wrote “the” on its own, which is not a full sentence.',count:1,order:2,question:'Introduce a teacher, then refer to the same teacher.',options:['I met a teacher. The teacher was kind.','I met the teacher. A teacher was kind.','I met teacher. Teacher was kind.'],answer:0,explanation:'Use “a teacher” when introducing someone for the first time. Use “the teacher” when referring to that same person again.'},{id:'modals',title:'Modal Verbs',category:'',summary:'',feedback:'',count:1,order:1,question:'Choose the word that expresses an obligation: You ___ wear a seat belt.',options:['might','must','could'],answer:1,explanation:'“Must” expresses an obligation. “Might” and “could” express possibilities in this context.'}];
 function icons(){if(globalThis.lucide)lucide.createIcons();root.querySelectorAll('.rv-phone button,.rv-phone select').forEach(el=>el.classList.add('cursor-interaction'));}
 function persist(){window.openai?.setWidgetState({modelContent:{screen:'Review',reference:'Ayrı kart ve klasik başlık',theme:root.querySelector('[data-variant]:not([hidden])')?.dataset.variant,freePractice:used?'Used today':'One chosen weak spot available',sort,selectedTopic:selected?.title||null},privateContent:{used,sort}})?.catch(()=>{});}
 function renderAllowance(){select.value=used?'used':'available';phones.forEach(p=>{p.dataset.used=String(used);p.querySelector('[data-free-title]').textContent=used?'Today’s practice is complete.':'One weak spot. One step forward.';p.querySelector('[data-free-description]').textContent=used?'Keep reviewing your saved feedback. Your next free practice is available tomorrow.':'Choose any saved weak spot below. Practise for free and get AI feedback.';p.querySelector('[data-free-status]').textContent=used?'Next free practice tomorrow':'1 free practice available today';});}
 phones.forEach(phone=>{
  phone.append(root.querySelector('template').content.cloneNode(true));const list=phone.querySelector('.rv-list'),overlay=phone.querySelector('.rv-overlay'),sheet=phone.querySelector('.rv-sheet'),body=phone.querySelector('.rv-sheet-body');let opener;
  function close(){overlay.hidden=true;[...phone.children].filter(n=>n!==overlay).forEach(n=>n.inert=false);opener?.focus();}
  function show(html,title,button){if(button)opener=button;body.innerHTML=html;sheet.setAttribute('aria-label',title);overlay.hidden=false;[...phone.children].filter(n=>n!==overlay).forEach(n=>n.inert=true);icons();overlay.querySelector('.rv-close').focus();}
  function detail(item,button){selected=item;show('<span class="rv-category">'+(item.category||'GRAMMAR')+'</span><h2>'+item.title+'</h2><div class="rv-meta"><span class="rv-count">1 occurrence</span><span>Last seen today</span></div>'+(item.feedback?'<div class="rv-feedback"><strong><i data-lucide="message-square-text" aria-hidden="true"></i>Saved feedback</strong><p>'+item.feedback+'</p></div>':'')+'<button class="rv-primary" data-practice>'+ (used?'Practise with Premium':'Start free practice')+'<i data-lucide="arrow-right" aria-hidden="true"></i></button><p class="rv-footnote">'+(used?'Your next free practice is available tomorrow.':'Use today’s free practice on this weak spot.')+'</p>',item.title,button);body.querySelector('[data-practice]').addEventListener('click',()=>used?premium():practice(item));persist();}
  function premium(){show('<span class="rv-category">GRAMMARLENS PREMIUM</span><h2>Keep working on your weak spots.</h2><p>Continue targeted practice with Premium, or come back tomorrow for your next free practice.</p><button class="rv-primary" data-dismiss>Back to Review<i data-lucide="arrow-left" aria-hidden="true"></i></button>','Premium preview');}
  function practice(item){let answer=-1;show('<span class="rv-category">PRACTICE · '+(item.category||'MODAL VERBS')+'</span><h2>'+item.title+'</h2><span class="rv-sample">Example exercise</span><p>'+item.question+'</p><div data-answers></div><button class="rv-primary" data-check disabled>Check answer<i data-lucide="arrow-right" aria-hidden="true"></i></button>','Example practice');const choices=body.querySelector('[data-answers]');item.options.forEach((text,i)=>{const b=document.createElement('button');b.className='rv-choice cursor-interaction';b.textContent=text;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{answer=i;choices.querySelectorAll('button').forEach((el,j)=>el.setAttribute('aria-pressed',String(i===j)));body.querySelector('[data-check]').disabled=false;});choices.append(b);});body.querySelector('[data-check]').addEventListener('click',()=>{show('<span class="rv-category">EXAMPLE FEEDBACK</span><h2>'+(answer===item.answer?'That’s correct.':'Let’s look at this together.')+'</h2><div class="rv-feedback"><strong>Correct answer</strong><p>'+item.options[item.answer]+'</p></div><p>'+item.explanation+'</p><button class="rv-primary" data-finish>Finish practice<i data-lucide="check" aria-hidden="true"></i></button>','Example feedback');body.querySelector('[data-finish]').addEventListener('click',()=>{used=true;renderAllowance();close();persist();});});}
  function renderList(){let ordered=[...items];if(sort==='recent')ordered.sort((a,b)=>b.order-a.order);if(sort==='frequent')ordered.sort((a,b)=>b.count-a.count||b.order-a.order);if(sort==='name')ordered.sort((a,b)=>a.title.localeCompare(b.title));list.replaceChildren();ordered.forEach(item=>{const b=document.createElement('button');b.className='rv-item cursor-interaction';b.setAttribute('aria-label',item.title+' — open details');b.innerHTML=(item.category?'<span class="rv-category">'+item.category+'</span>':'')+'<span class="rv-item-title"><strong>'+item.title+'</strong><i data-lucide="chevron-right" aria-hidden="true"></i></span>'+(item.summary?'<span class="rv-excerpt">'+item.summary+'</span>':'')+'<span class="rv-meta"><span class="rv-count">1 occurrence</span><span class="rv-date"><i data-lucide="clock-3" aria-hidden="true"></i>Last seen today</span></span>';b.addEventListener('click',()=>detail(item,b));list.append(b);});phone.querySelector('.rv-sort select').value=sort;icons();}
  phone.renderList=renderList;renderList();phone.querySelector('.rv-sort select').addEventListener('change',e=>{sort=e.target.value;phones.forEach(p=>p.renderList?.());persist();});
  phone.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.nav==='review'){close();return;}show('<span class="rv-category">GRAMMARLENS</span><h2>'+(b.dataset.nav==='home'?'Home':'Ahmet')+'</h2><p>'+(b.dataset.nav==='home'?'Your daily test and learning journey.':'Your profile and preferences.')+'</p><button class="rv-primary" data-dismiss>Back to Review<i data-lucide="arrow-left" aria-hidden="true"></i></button>',b.dataset.nav,b);}));
  overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('.rv-close')||e.target.closest('[data-dismiss]'))close();});overlay.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const buttons=[...overlay.querySelectorAll('button:not([disabled])')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus();}}});
 });
 select.addEventListener('change',()=>{used=select.value==='used';renderAllowance();persist();});window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(!s)return;used=s.used===true;if(['recent','frequent','name'].includes(s.sort))sort=s.sort;renderAllowance();phones.forEach(p=>p.renderList());});renderAllowance();icons();
})();
</script>
