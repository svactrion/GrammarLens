#gl-profile .gp-stage{padding:24px 10px;min-height:1290px}
#gl-profile .gp-phone{--gp-bg:#F3EFE6;--gp-card:#FFFBF4;--gp-tile:#F6F0E5;--gp-text:#1B1B1F;--gp-muted:#46464F;--gp-brand:#FF7A1A;--gp-ink:#241200;--gp-link:#0D3B8F;--gp-info:#D7E1FA;--gp-oninfo:#0A2E70;--gp-line:#DED5C6;--gp-nav:#FFFCF7;--gp-navline:#D2C6B4;--gp-shadow:0 5px 18px #4830181A;--gp-navshadow:0 6px 22px #48301826;--gp-scale:1;max-width:390px;width:100%;margin:auto;background:var(--gp-bg);color:var(--gp-text);font:400 14px/1.45 'Nunito Sans',sans-serif;border-radius:30px;position:relative;overflow:hidden;box-shadow:0 14px 46px #24120018;color-scheme:light}
#gl-profile .gp-dark{--gp-bg:#151517;--gp-card:#252528;--gp-tile:#303034;--gp-text:#F0ECE7;--gp-muted:#C9C5D0;--gp-brand:#FF8A3D;--gp-ink:#F0ECE7;--gp-link:#B4C8FF;--gp-info:#243859;--gp-oninfo:#D8E1FF;--gp-line:#45454D;--gp-nav:#2D2D32;--gp-navline:#595961;--gp-shadow:0 5px 18px #0000002B;--gp-navshadow:0 6px 22px #00000055;color-scheme:dark}
#gl-profile .gp-phone *{box-sizing:border-box}#gl-profile .gp-phone button,#gl-profile .gp-phone input{font:inherit}#gl-profile .gp-phone button{color:inherit}#gl-profile .gp-phone h1,#gl-profile .gp-phone h2,#gl-profile .gp-phone h3,#gl-profile .gp-phone p{margin:0}#gl-profile .gp-phone svg{width:19px;height:19px;flex-shrink:0}
#gl-profile .gp-header{padding:14px 22px 20px}#gl-profile .gp-status{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--gp-ink);margin-bottom:23px}#gl-profile .gp-status span:last-child{display:flex;gap:5px}#gl-profile .gp-status svg{width:14px;height:14px}#gl-profile .gp-header h1{font-size:34px;line-height:1.1;letter-spacing:-1.1px;font-weight:900;color:var(--gp-ink)}#gl-profile .gp-header p{color:var(--gp-muted);font-size:calc(14px * var(--gp-scale));margin-top:7px}

<script>
(()=>{
 const root=document.getElementById('gl-profile'),phones=[...root.querySelectorAll('.gp-phone')];let name='Ahmet',settings={},collection='current';
 function restore(s){if(!s||s.screen!=='profile')return;if(typeof s.name==='string'&&s.name.trim())name=s.name.slice(0,32);if(s.settings&&typeof s.settings==='object')settings=s.settings;if(['current','accumulated'].includes(s.collection))collection=s.collection;}
 restore(window.openai?.widgetState?.privateContent);
 function icons(){globalThis.lucide?.createIcons();root.querySelectorAll('button,input').forEach(e=>e.classList.add('cursor-interaction'));}

 function apply(){phones.forEach(p=>{const cfg=settings[p.dataset.initial]||{theme:p.dataset.initial,size:'medium'};p.classList.toggle('gp-dark',cfg.theme==='dark'||cfg.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);p.style.setProperty('--gp-scale',({small:.92,medium:1,large:1.16})[cfg.size]||1);p.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===cfg.theme)));p.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.size===cfg.size)));p.querySelector('[data-name]').textContent=name;p.querySelector('input[name=name]').value=name;});}
 phones.forEach(p=>{
  p.append(root.querySelector('template').content.cloneNode(true));const overlay=p.querySelector('.gp-overlay'),sheet=p.querySelector('.gp-sheet'),body=p.querySelector('.gp-sheet-content'),identity=p.querySelector('.gp-identity');let opener;

  p.querySelector('[data-edit]').addEventListener('click',()=>{identity.classList.add('gp-editing');identity.querySelector('.gp-toast').hidden=true;identity.querySelector('input').focus();});p.querySelector('[data-cancel]').addEventListener('click',()=>{identity.classList.remove('gp-editing');apply();p.querySelector('[data-edit]').focus();});

  function renderMedals(){
   const medals=collection==='accumulated'?[{id:'oct',label:'Oct 2026',title:'October 2026',pending:true},{id:'sep',label:'Sep 2026',title:'September 2026'},{id:'aug',label:'Aug 2026',title:'August 2026'},{id:'jul',label:'Jul 2026',title:'July 2026'},{id:'jun',label:'Jun 2026',title:'June 2026'},{id:'welcome',label:'Welcome',title:'Welcome'}]:[{id:'oct',label:'Oct 2026',title:'October 2026',pending:true},{id:'welcome',label:'Welcome',title:'Welcome'}];
   p.querySelector('[data-earned-count]').textContent=(medals.length-1)+' earned';
   const row=p.querySelector('.gp-medal-row');row.replaceChildren();
   medals.forEach(m=>{const b=document.createElement('button');b.className='gp-medal cursor-interaction';b.dataset.medal=m.id;b.setAttribute('aria-label',m.title+' medal, '+(m.pending?'not yet earned':'earned'));b.innerHTML='<span class="gp-medal-art '+(m.id==='welcome'?'':'gp-oct')+'" aria-hidden="true"></span><strong>'+m.label+'</strong>'+(m.pending?'<small class="gp-current">In progress</small>':'');row.append(b);b.addEventListener('click',()=>{show('<div class="gp-medal-detail"><span class="gp-medal-art '+(m.id==='welcome'?'':'gp-oct')+(m.pending?' gp-pending-art':'')+'" aria-hidden="true"></span><h2>'+m.title+'</h2><div class="gp-detail-status"><i data-lucide="'+(m.pending?'hourglass':'circle-check')+'" aria-hidden="true"></i>'+(m.pending?'Not earned yet':'Earned')+'</div><p>'+(m.pending?'Green Slope · 7 points':m.id==='welcome'?'The beginning of your journey.':'Monthly medal')+'</p>'+(m.pending?'<p>Reach 78 points to earn Bronze.<br><strong>71 points to go.</strong></p>':'')+'</div>','Medal details',b);sheet.dataset.kind='medal';});});
  }
  p.renderMedals=renderMedals;renderMedals();
  p.querySelectorAll('[data-theme],[data-size]').forEach(b=>b.addEventListener('click',()=>{const key=p.dataset.initial;settings[key]||={theme:key,size:'medium'};if(b.dataset.theme)settings[key].theme=b.dataset.theme;if(b.dataset.size)settings[key].size=b.dataset.size;apply();persist();}));
  p.querySelectorAll('[data-destination]').forEach(b=>b.addEventListener('click',()=>{const title=b.dataset.destination;show('<h2>'+title+'</h2><button class="gp-text-button" data-dismiss><i data-lucide="arrow-left" aria-hidden="true"></i>Back to Profile</button>',title,b);}));
  overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('.gp-close,[data-dismiss],[data-selected-avatar]'))close();});overlay.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const list=[...overlay.querySelectorAll('button,input')];if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus();}}});p.querySelector('[data-profile]').addEventListener('click',()=>p.querySelector('[data-edit]').focus());
 });const collectionSelect=root.querySelector('#gp-collection');collectionSelect.value=collection;collectionSelect.addEventListener('change',()=>{collection=collectionSelect.value;phones.forEach(p=>p.renderMedals());persist();});apply();icons();window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.privateContent);collectionSelect.value=collection;phones.forEach(p=>p.renderMedals());apply();});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',apply);
})();
</script>
