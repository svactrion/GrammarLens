#gl-navy-daily .r-controls { margin-bottom:14px; }
#gl-navy-daily .r-field { width:175px; }
#gl-navy-daily .r-stage { padding:24px 10px;min-height:1080px; }
#gl-navy-daily .r-phone { --r-bg:#FAF3EC;--r-card:#EDE4D8;--r-tile:#FAF3EC;--r-nav:#F3ECE3;--r-text:#1B1B1F;--r-muted:#46464F;--r-ink:#241200;--r-brand:#FF7A1A;--r-link:#0D3B8F;--r-button:#0D3B8F;--r-onbutton:#FFFFFF;--r-line:#DED3C2;--r-navline:#CFC2B0;--r-info:#D7E1FA;--r-oninfo:#0A2E70;--r-shadow:0 5px 16px #40261013;--r-navshadow:0 5px 20px #40261024;--r-navborder:1px;--r-hero-size:108px;width:100%;max-width:390px;min-height:990px;margin:0 auto;display:flex;flex-direction:column;background:var(--r-bg);color:var(--r-text);font:400 14px/1.45 'Nunito Sans',sans-serif;border-radius:30px;overflow:hidden;position:relative;box-shadow:0 14px 46px #24120018;color-scheme:light; }
#gl-navy-daily .r-ivory { --r-bg:#F3EFE6;--r-card:#FFFBF4;--r-tile:#F6F0E5;--r-nav:#FFFCF7;--r-line:#DED5C6;--r-navline:#D2C6B4;--r-shadow:0 5px 18px #4830181A;--r-navshadow:0 6px 22px #48301826; }
#gl-navy-daily .r-dark { --r-bg:#151517;--r-card:#252528;--r-tile:#303034;--r-nav:#2D2D32;--r-text:#F0ECE7;--r-muted:#C9C5D0;--r-ink:#F0ECE7;--r-brand:#FF8A3D;--r-link:#B4C8FF;--r-line:#45454D;--r-navline:#595961;--r-info:#243859;--r-oninfo:#D8E1FF;--r-shadow:0 5px 18px #0000002B;--r-navshadow:0 6px 22px #00000055;color-scheme:dark; }
#gl-navy-daily .r-phone * { box-sizing:border-box; }
#gl-navy-daily .r-phone button { font:inherit; }
#gl-navy-daily .r-phone button:disabled { opacity:.35;cursor:default; }
#gl-navy-daily .r-phone h2,#gl-navy-daily .r-phone h3,#gl-navy-daily .r-phone p { margin:0; }
#gl-navy-daily .r-header { padding:14px 22px 10px;color:var(--r-ink); }
#gl-navy-daily .r-status { display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;margin-bottom:16px; }
#gl-navy-daily .r-status span:last-child { display:flex;gap:5px; }
#gl-navy-daily .r-status svg { width:14px;height:14px; }
#gl-navy-daily .r-brand-row { display:flex;justify-content:space-between;align-items:center;gap:8px; }
#gl-navy-daily .r-brand { font-size:34px;font-weight:900;letter-spacing:-1.4px;line-height:1.1; }
#gl-navy-daily .r-upper { padding:0 18px 18px; }
#gl-navy-daily .r-greeting { min-height:112px;padding:4px 3px 8px;display:flex;align-items:center;justify-content:space-between;gap:6px; }
#gl-navy-daily .r-greeting p { color:var(--r-muted);font-size:14px; }
#gl-navy-daily .r-greeting h2 { color:var(--r-ink);font-size:25px;font-weight:800;line-height:1.2;letter-spacing:-.5px;margin-top:2px; }
#gl-navy-daily .r-hero-button { position:relative;background:transparent;border:0;padding:0;width:var(--r-hero-size);height:var(--r-hero-size);flex-shrink:0; }
#gl-navy-daily .r-hero-image { position:absolute;inset:0;background-image:var(--r-hero);background-size:contain;background-repeat:no-repeat;background-position:center; }
#gl-navy-daily .r-hero-button > span:last-child { position:absolute;bottom:8px;right:0;width:23px;height:23px;border-radius:8px;border:1px solid var(--r-line);background:var(--r-card);color:var(--r-ink);display:flex;align-items:center;justify-content:center; }
#gl-navy-daily .r-hero-button svg { width:12px;height:12px; }
#gl-navy-daily .r-journey { background:var(--r-brand);border-radius:24px;overflow:hidden;box-shadow:var(--r-shadow); }
#gl-navy-daily .r-daily { background:var(--r-brand);color:#241200;padding:18px 18px 14px; }
#gl-navy-daily .r-daily-label { display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase; }
#gl-navy-daily .r-daily-label > span:last-child { display:flex;align-items:center;gap:4px;font-weight:600;text-transform:none;letter-spacing:0; }
#gl-navy-daily .r-daily-label svg { width:13px;height:13px; }
#gl-navy-daily .r-daily-summary { display:flex;justify-content:space-between;align-items:center;gap:9px;min-height:73px;margin:12px 0 11px; }
#gl-navy-daily .r-daily-summary h2 { font-size:25px;letter-spacing:-.65px;line-height:1.15;font-weight:900; }
#gl-navy-daily .r-daily-summary p { font-size:13px;line-height:1.4;margin-top:7px;max-width:195px; }
#gl-navy-daily .r-score { min-width:67px;flex-shrink:0;padding:9px 10px;border-radius:16px;background:#FAF3EC66;display:flex;flex-direction:column;align-items:center;justify-content:center; }
#gl-navy-daily .r-score strong { font-size:29px;font-weight:900;letter-spacing:-1px;line-height:1; }
#gl-navy-daily .r-score small { font-size:11px;font-weight:700;margin-top:6px; }
#gl-navy-daily .r-cta { width:100%;min-height:48px;border:0;border-radius:14px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--r-button);color:var(--r-onbutton);font-size:14px!important;font-weight:800!important;margin-top:14px; }
#gl-navy-daily .r-cta svg { width:17px;height:17px; }
#gl-navy-daily .r-path { margin:0; }
#gl-navy-daily .r-map-heading { text-align:center;font-weight:900; }
#gl-navy-daily .r-combined .r-map-heading { color:#241200;padding:19px 12px 17px;font-size:23px;line-height:1.15;letter-spacing:-.55px; }
#gl-navy-daily .r-combined .r-map-heading::before { content:'YOUR JOURNEY';display:block;font-size:11px;line-height:1.4;font-weight:800;letter-spacing:1.6px;margin-bottom:6px; }
#gl-navy-daily .r-combined .r-daily { background:#0D3B8F;color:#FFFFFF;border-radius:17px;margin:0 14px 14px;padding:14px; }
#gl-navy-daily .r-combined .r-daily-label { display:none; }
#gl-navy-daily .r-combined .r-daily-summary { margin:0;min-height:68px;gap:8px; }
#gl-navy-daily .r-combined .r-daily-summary h2 { font-size:21px;line-height:1.15;letter-spacing:-.4px; }
#gl-navy-daily .r-combined .r-daily-summary p { max-width:205px;color:#DFE8FA; }
