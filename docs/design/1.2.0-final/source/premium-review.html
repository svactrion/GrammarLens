<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
<style>
#gl-pr .stage{padding:20px 0}#gl-pr .phone{--bg:#F3EFE6;--surface:#FFFBF4;--ink:#1B1B1F;--muted:#54515B;--line:#DED5C6;--blue:#0D3B8F;--soft:#D7E1FA;--onsoft:#0A2E70;--focus:#183854;--focusink:#FFF9F0;--focusmuted:#D4E0EA;--orange:#FF8A3D;--onorange:#241200;--shadow:0 5px 18px #48301818;--navshadow:0 6px 22px #48301826;background:var(--bg);color:var(--ink);font:400 14px/1.5 'Nunito Sans',sans-serif;width:100%;max-width:390px;min-height:860px;border:1px solid var(--line);border-radius:30px;margin:auto;overflow:hidden;position:relative;display:flex;flex-direction:column;color-scheme:light}
#gl-pr .phone.dark{--bg:#151517;--surface:#252528;--ink:#F0ECE7;--muted:#C9C5D0;--line:#45454D;--blue:#B4C8FF;--soft:#243859;--onsoft:#D8E1FF;--focus:#203D57;--focusink:#FFF9F0;--focusmuted:#D4E0EA;--shadow:0 5px 18px #0000002B;--navshadow:0 6px 22px #00000055;color-scheme:dark}
#gl-pr .phone *{box-sizing:border-box}#gl-pr .phone button,#gl-pr .phone select{font:inherit}#gl-pr .phone h1,#gl-pr .phone h2,#gl-pr .phone p{margin:0}#gl-pr .phone svg{width:18px;height:18px;flex-shrink:0}
#gl-pr .status{display:flex;justify-content:space-between;padding:16px 24px 21px;font-size:12px;font-weight:800}#gl-pr .status span:last-child{display:flex;gap:5px}#gl-pr .status svg{width:14px;height:14px}
#gl-pr header{padding:0 20px 22px}#gl-pr header h1{font-size:34px;letter-spacing:-1px;line-height:1.15;font-weight:900}#gl-pr header p{color:var(--muted);margin-top:8px;font-size:14px}
#gl-pr main{padding:0 18px 20px}#gl-pr .focus{min-height:190px;background:var(--focus);color:var(--focusink);border-radius:24px;padding:18px;box-shadow:var(--shadow)}#gl-pr .eyebrow{font-size:11px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:7px}#gl-pr .focus .eyebrow{color:var(--focusmuted)}#gl-pr .eyebrow svg{color:var(--orange);width:16px;height:16px}#gl-pr .focus h2{font-size:23px;font-weight:900;line-height:1.15;letter-spacing:-.5px;margin-top:12px}#gl-pr .focus p{color:var(--focusmuted);font-size:13px;margin-top:8px;line-height:1.45}
#gl-pr .cta{width:100%;border:0;border-radius:13px;background:var(--orange);color:var(--onorange);font-weight:800!important;min-height:46px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;text-align:left}
#gl-pr .list-head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:19px 0 11px}#gl-pr .list-head h2{font-size:19px;letter-spacing:-.5px;font-weight:800;line-height:1.2}#gl-pr .list-head h2 span{color:var(--muted);font-size:13px;font-weight:600;margin-left:3px}#gl-pr .sort{display:flex;align-items:center;gap:2px;color:var(--blue)}#gl-pr .sort svg{width:15px;height:15px}#gl-pr .sort select{background:transparent;border:0;color:var(--blue);font-size:12px;font-weight:800;max-width:96px;min-height:44px}#gl-pr .sort option{background:var(--surface);color:var(--ink)}
#gl-pr .list{display:grid;gap:11px}#gl-pr .item{width:100%;text-align:left;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:16px;box-shadow:var(--shadow)}#gl-pr .item-top{display:flex;align-items:center;justify-content:space-between;gap:9px}#gl-pr .item strong{font-size:18px;line-height:1.25;font-weight:800;letter-spacing:-.3px}#gl-pr .item svg{color:var(--muted)}#gl-pr .excerpt{display:block;font-size:13px;line-height:1.5;color:var(--muted);margin-top:9px}#gl-pr .meta{display:inline-block;background:var(--soft);color:var(--onsoft);font-weight:800;font-size:11px;line-height:1.4;padding:5px 8px;border-radius:8px;margin-top:12px}
#gl-pr .navwrap{margin-top:auto;padding:14px 14px 24px}#gl-pr nav{display:flex;justify-content:space-around;border-radius:29px;border:1px solid var(--line);box-shadow:var(--navshadow);background:var(--surface);padding:10px 5px}#gl-pr nav button{border:0;background:transparent;color:var(--ink);min-width:70px;min-height:47px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:11px}#gl-pr nav svg{width:22px;height:22px}#gl-pr nav [aria-current]{color:var(--blue);font-weight:800}
#gl-pr .veil{position:absolute;inset:0;background:#11172585;z-index:3;padding:160px 16px 24px}#gl-pr .veil[hidden]{display:none}#gl-pr .dialog{border-radius:24px;background:var(--surface);color:var(--ink);padding:21px;box-shadow:var(--navshadow)}#gl-pr .dialog-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--blue)}#gl-pr .close{border:0;background:transparent;color:var(--ink);width:44px;height:44px;display:grid;place-items:center}#gl-pr .dialog h2{font-size:25px;line-height:1.2;font-weight:900;letter-spacing:-.4px;margin:12px 0}#gl-pr .dialog p{color:var(--muted);font-size:14px}#gl-pr .dialog .meta{margin:0 0 17px}#gl-pr .dialog .explain{padding-top:14px;border-top:1px solid var(--line);margin-top:14px}
#gl-pr .empty{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:25px 20px;box-shadow:var(--shadow)}#gl-pr .empty>svg{width:32px;height:32px;color:var(--blue);margin-bottom:15px}#gl-pr .empty h2{font-size:25px;font-weight:900;line-height:1.2}#gl-pr .empty p{color:var(--muted);margin-top:12px;font-size:14px}#gl-pr .notice{margin-top:12px;text-align:center}
@media(max-width:360px){#gl-pr main{padding-left:13px;padding-right:13px}#gl-pr .focus{padding:17px}#gl-pr .list-head h2{font-size:17px}#gl-pr .item{padding:14px}}
</style>
<div id="gl-pr">
 <div class="viz-controls"><label class="form-label">Görünüm<select id="pr-theme" class="form-select"><option value="light">Fil dişi</option><option value="dark">Koyu</option></select></label><label class="form-label">Kayıt durumu<select id="pr-state" class="form-select"><option value="saved">Hatalar birikmiş</option><option value="empty">Henüz hata kaydı yok</option></select></label></div>
 <div class="stage viz-dotted-background"><article class="phone" aria-label="Premium Review ekranı">
 <div class="content"><div class="status"><span>9:41</span><span><i data-lucide="signal" aria-hidden="true"></i><i data-lucide="wifi" aria-hidden="true"></i><i data-lucide="battery-medium" aria-hidden="true"></i></span></div><header><h1>Review</h1><p>Turn your mistakes into progress.</p></header><main></main></div>
 <div class="navwrap"><nav aria-label="Main navigation"><button data-nav="Home" class="cursor-interaction"><i data-lucide="house" aria-hidden="true"></i>Home</button><button aria-current="page" data-nav="Review" class="cursor-interaction"><i data-lucide="history" aria-hidden="true"></i>Review</button><button data-nav="Profile" class="cursor-interaction"><i data-lucide="user-round" aria-hidden="true"></i>Profile</button></nav></div>
 <div class="veil" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="pr-dialog-title"><div class="dialog-top"><span class="eyebrow">SAVED WEAK SPOT</span><button class="close cursor-interaction" aria-label="Close details"><i data-lucide="x" aria-hidden="true"></i></button></div><div class="dialog-body"></div></section></div>
 </article><p class="text-small text-muted notice" role="status">Premium görünüm önerisi · Örnek veriler</p></div>
</div>
<script>
(()=>{
const root=document.getElementById('gl-pr'),phone=root.querySelector('.phone'),main=root.querySelector('main'),veil=root.querySelector('.veil'),notice=root.querySelector('.notice');
let state={theme:'light',records:'saved',sort:'recent'},opener=null;
const items=[{id:'gerund',title:'Gerund vs. Infinitive',count:1,date:'today',order:3,summary:"The base form doesn’t work after ‘enjoy’; you need the -ing form."},{id:'modals',title:'Modal Verbs',count:2,date:'today',order:2,summary:''},{id:'articles',title:'Articles',count:1,date:'yesterday',order:1,summary:''}];
function icon(){if(window.lucide)lucide.createIcons();}
function save(){window.openai?.setWidgetState({modelContent:{screen:'Premium Review',design:'Suggested focus based on repeated mistakes',theme:state.theme,records:state.records},privateContent:state})?.catch(()=>{});}
function restore(s){if(!s)return;if(['light','dark'].includes(s.theme))state.theme=s.theme;if(['saved','empty'].includes(s.records))state.records=s.records;if(['recent','frequent'].includes(s.sort))state.sort=s.sort;}
function close(){veil.hidden=true;root.querySelector('.content').inert=false;root.querySelector('.navwrap').inert=false;opener?.focus();}
function open(item,button){opener=button;root.querySelector('.dialog-body').innerHTML='<h2 id="pr-dialog-title">'+item.title+'</h2><span class="meta">'+item.count+' '+(item.count===1?'time':'times')+' · last seen '+item.date+'</span>'+(item.summary?'<p>'+item.summary+'</p>':'<p>Revisit this topic with a new practice session.</p>')+'<p class="explain">Practise this weak spot and get feedback on your answers.</p><button class="cta cursor-interaction" data-start>Start practice<i data-lucide="arrow-right" aria-hidden="true"></i></button>';veil.hidden=false;root.querySelector('.content').inert=true;root.querySelector('.navwrap').inert=true;icon();root.querySelector('.close').focus();root.querySelector('[data-start]').onclick=()=>{close();notice.textContent='Önizleme: '+item.title+' için mevcut pratik akışına geçilir. Gerçek oturum başlatılmadı.';};}
function render(){phone.classList.toggle('dark',state.theme==='dark');root.querySelector('#pr-theme').value=state.theme;root.querySelector('#pr-state').value=state.records;
if(state.records==='empty'){main.innerHTML='<section class="empty"><i data-lucide="notebook-pen" aria-hidden="true"></i><h2>Your next step<br>starts with practice.</h2><p>As you practise, your mistakes will appear here so you can work on them again.</p><button class="cta cursor-interaction" data-explore>Explore Topic Practice<i data-lucide="arrow-right" aria-hidden="true"></i></button></section>';root.querySelector('[data-explore]').onclick=()=>{notice.textContent='Önizleme: Premium Topic Practice konu seçme ekranına geçilir.';};icon();return;}
const suggested=[...items].sort((a,b)=>b.count-a.count||b.order-a.order)[0];
main.innerHTML='<section class="focus"><div class="eyebrow"><i data-lucide="focus" aria-hidden="true"></i>SUGGESTED FOCUS</div><h2>'+suggested.title+'</h2><p>Saved '+suggested.count+' times · Most repeated</p><button class="cta cursor-interaction" data-focus>Practise this weak spot<i data-lucide="arrow-right" aria-hidden="true"></i></button></section><div class="list-head"><h2>Saved weak spots <span>3</span></h2><label class="sort"><i data-lucide="arrow-down-wide-narrow" aria-hidden="true"></i><select aria-label="Sort weak spots"><option value="recent">Recent</option><option value="frequent">Repeated</option></select></label></div><div class="list"></div>';
root.querySelector('[data-focus]').onclick=e=>open(suggested,e.currentTarget);
const ordered=[...items].sort(state.sort==='frequent'?(a,b)=>b.count-a.count||b.order-a.order:(a,b)=>b.order-a.order);
for(const item of ordered){const b=document.createElement('button');b.className='item cursor-interaction';b.innerHTML='<span class="item-top"><strong>'+item.title+'</strong><i data-lucide="chevron-right" aria-hidden="true"></i></span>'+(item.summary?'<span class="excerpt">'+item.summary+'</span>':'')+'<span class="meta">'+item.count+' '+(item.count===1?'time':'times')+' · last seen '+item.date+'</span>';b.onclick=()=>open(item,b);root.querySelector('.list').append(b);}
const sort=root.querySelector('.sort select');sort.value=state.sort;sort.onchange=()=>{state.sort=sort.value;render();save();};icon();}
root.querySelector('#pr-theme').onchange=e=>{state.theme=e.target.value;render();save();};root.querySelector('#pr-state').onchange=e=>{close();state.records=e.target.value;render();save();};root.querySelector('.close').onclick=close;veil.onclick=e=>{if(e.target===veil)close();};veil.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const b=[...veil.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===b[0]){e.preventDefault();b.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===b.at(-1)){e.preventDefault();b[0].focus();}}};
root.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{notice.textContent=b.dataset.nav==='Review'?'Premium görünüm önerisi · Örnek veriler':'Önizleme: '+b.dataset.nav+' ekranına dönülür.';});
restore(window.openai?.widgetState?.privateContent);render();window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s){close();restore(s);render();}});
})();
</script>
