name: grammar_lens
description: An AI-powered grammar coach for people who learned English by speaking it.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  cupertino_icons: ^1.0.6
  sqflite_common_ffi_web: ^1.1.2
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
