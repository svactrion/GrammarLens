name: grammar_lens
description: An AI-powered grammar coach for people who learned English by speaking it.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  cupertino_icons: ^1.0.6
  sqflite_common_ffi_web: ^1.1.2
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.1.6
  purchases_flutter: ^10.10.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  # The stock avatar illustrations (lib/models/avatar.dart) — registered as
  # a folder, not file-by-file, so adding avatar_13.webp later is just
  # dropping the file in plus bumping Avatar.count, nothing here to edit.
  assets:
    - assets/avatars/
    # Premium offer card benefit icons: 1x here, 2.0x/ and 3.0x/ variants
    # picked up by Flutter's resolution matching. A folder entry does not
    # include subfolders, so the design sources in assets/icons/_source/
    # are not bundled.
    - assets/icons/
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Variable.ttf

# Generates ios/Runner/Assets.xcassets/AppIcon.appiconset from one master
# image (`dart run flutter_launcher_icons`) instead of hand-maintaining
# every explicit size — the previous Contents.json referenced Flutter's
# default placeholder filenames, orphaned once a real icon replaced them.
# iOS only: this app has no Android release track, so android/'s icon is
# untouched. `remove_alpha_ios: true` matches the source image, which
# already has no alpha channel and no baked-in corner rounding (both are
# App Store requirements — Apple applies its own mask).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  android: false
  remove_alpha_ios: true
